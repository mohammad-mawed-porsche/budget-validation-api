<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Budget validation API architecture</title>
  <desc id="description">API Gateway and EventBridge send work to Lambda and SQS. The workflow checks Heimdall and Productive, persists state in DynamoDB, and posts notifications to Slack.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10213d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#4867e8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 42px; font-weight: 700; fill: #10213d; }
      .subtitle { font-size: 20px; font-weight: 400; fill: #60708a; }
      .group { font-size: 15px; font-weight: 700; letter-spacing: 2px; fill: #60708a; }
      .label { font-size: 21px; font-weight: 700; fill: #10213d; }
      .detail { font-size: 16px; font-weight: 400; fill: #60708a; }
      .small { font-size: 14px; font-weight: 600; fill: #4867e8; }
      .box { fill: #ffffff; stroke: #dce3ef; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .accent-box { fill: #f5f7ff; stroke: #4867e8; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .success-box { fill: #f2fbf6; stroke: #26865b; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .line { fill: none; stroke: #4867e8; stroke-width: 3; marker-end: url(#arrow); }
      .soft-line { fill: none; stroke: #9aa9bd; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <rect x="55" y="48" width="1490" height="804" rx="28" fill="#ffffff" stroke="#e2e8f1" stroke-width="2"/>

  <text x="105" y="120" class="title">Budget validation API</text>
  <text x="105" y="158" class="subtitle">Daily Cost ID validation and channel notifications on AWS</text>

  <text x="105" y="222" class="group">ENTRY POINTS</text>
  <rect x="105" y="246" width="245" height="112" class="box"/>
  <circle cx="143" cy="284" r="16" fill="#4867e8"/>
  <text x="174" y="291" class="label">Frontend / client</text>
  <text x="132" y="327" class="detail">Bearer token requests</text>

  <rect x="105" y="414" width="245" height="112" class="box"/>
  <circle cx="143" cy="452" r="16" fill="#4867e8"/>
  <text x="174" y="459" class="label">Daily schedule</text>
  <text x="132" y="495" class="detail">EventBridge Scheduler</text>

  <text x="430" y="222" class="group">API AND QUEUE</text>
  <rect x="430" y="246" width="245" height="112" class="accent-box"/>
  <text x="462" y="290" class="label">API Gateway</text>
  <text x="462" y="324" class="detail">HTTP API</text>

  <rect x="755" y="246" width="245" height="112" class="accent-box"/>
  <text x="787" y="290" class="label">API Lambda</text>
  <text x="787" y="324" class="detail">Fastify + authentication</text>

  <rect x="755" y="414" width="245" height="112" class="accent-box"/>
  <text x="787" y="458" class="label">SQS</text>
  <text x="787" y="492" class="detail">Run queue + DLQ</text>

  <text x="1080" y="222" class="group">WORKFLOW</text>
  <rect x="1080" y="414" width="350" height="112" class="accent-box"/>
  <text x="1112" y="458" class="label">Workflow Lambda</text>
  <text x="1112" y="492" class="detail">Validate, update, notify</text>

  <path d="M350 302 H430" class="line"/>
  <path d="M675 302 H755" class="line"/>
  <path d="M878 358 V414" class="line"/>
  <path d="M350 470 H755" class="line"/>
  <path d="M1000 470 H1080" class="line"/>

  <text x="105" y="616" class="group">STATE AND CONFIGURATION</text>
  <rect x="105" y="642" width="285" height="120" class="box"/>
  <text x="137" y="688" class="label">DynamoDB</text>
  <text x="137" y="722" class="detail">Runs, results, cooldowns</text>

  <rect x="445" y="642" width="285" height="120" class="box"/>
  <text x="477" y="688" class="label">Parameter Store</text>
  <text x="477" y="722" class="detail">Encrypted credentials</text>

  <text x="805" y="616" class="group">EXTERNAL SYSTEMS</text>
  <rect x="805" y="642" width="200" height="120" class="box"/>
  <text x="837" y="688" class="label">Heimdall</text>
  <text x="837" y="722" class="detail">Microsoft Graph</text>

  <rect x="1055" y="642" width="200" height="120" class="box"/>
  <text x="1087" y="688" class="label">Productive</text>
  <text x="1087" y="722" class="detail">Budget API</text>

  <rect x="1305" y="642" width="200" height="120" class="success-box"/>
  <circle cx="1342" cy="683" r="14" fill="#26865b"/>
  <text x="1370" y="690" class="label">Slack</text>
  <text x="1337" y="724" class="detail">Private channel</text>

  <path d="M1185 526 C1120 570 990 582 390 676" class="soft-line"/>
  <path d="M1138 526 C990 575 760 580 730 676" class="soft-line"/>
  <path d="M1210 526 L940 642" class="line"/>
  <path d="M1260 526 L1155 642" class="line"/>
  <path d="M1320 526 L1405 642" class="line"/>
  <path d="M930 358 C1040 375 1310 375 1405 642" class="soft-line"/>

  <rect x="105" y="804" width="14" height="14" rx="4" fill="#4867e8"/>
  <text x="130" y="817" class="small">Application flow</text>
  <rect x="280" y="804" width="14" height="14" rx="4" fill="#26865b"/>
  <text x="305" y="817" class="small" style="fill:#26865b">Slack accepted delivery</text>
</svg>
